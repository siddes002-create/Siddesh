<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retail Nanban Billing POS</title>

<link rel="stylesheet" href="css/billing.css">

</head>

<body>

<header>

    <div class="logo">
        🛒 <b>Retail Nanban POS</b>
    </div>

    <div id="liveTime"></div>

</header>


<div class="container">

    <div class="left">

        <!-- Customer -->

        <div class="card">

            <h2>👤 Customer Details</h2>

            <input
                type="text"
                id="custName"
                placeholder="Customer Name">

            <input
                type="text"
                id="custPhone"
                placeholder="Phone Number">

        </div>


        <!-- Product Preview -->

        <div class="card">

            <h2>📦 Product Preview</h2>

            <div class="product-preview">

                <img
                    id="productImage"
                    src="https://via.placeholder.com/140x180?text=No+Image"
                    alt="Product">

                <div>

                    <h3 id="previewName">

                        No Product

                    </h3>

                    <p>

                        Style :
                        <b id="previewStyle">-</b>

                    </p>

                    <p>

                        Stock :
                        <b id="previewStock">0</b>

                    </p>

                    <p>

                        Price :
                        <b id="previewPrice">₹0</b>

                    </p>

                    <span
                        id="stockStatus"
                        class="stock">

                        No Stock

                    </span>

                </div>

            </div>

        </div>
      <!-- Barcode Scan -->

<div class="card">

    <h2>🔍 Scan Product</h2>

    <input
        id="sku"
        type="text"
        placeholder="Scan Barcode"
        onkeydown="searchSKU(event)"
        autofocus>

    <div class="row">

        <input
            id="qty"
            type="number"
            value="1"
            min="1">

        <select id="size">

            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
            <option>XXL</option>

        </select>

        <button onclick="addItem()">

            ➕ Add

        </button>

    </div>

</div>


<!-- Shopping Cart -->

<div class="card">

    <h2>🛒 Shopping Cart</h2>

    <div id="cart" class="cart-list">

        <div class="empty-cart">

            Cart is Empty

        </div>

    </div>

</div>

</div>


<!-- Right Side -->

<div class="right">

<div class="card">

<h2>💰 Bill Summary</h2>

<div class="summary">

<p>
<span>Items</span>
<span id="items">0</span>
</p>

<p>
<span>Subtotal</span>
<span id="sub">₹0</span>
</p>

<p>
<span>Discount</span>
<span>₹0</span>
</p>

<h1 id="grand">₹0</h1>

</div>

<select id="payment">

<option>Cash</option>
<option>UPI</option>
<option>Card</option>

</select>

<button onclick="saveBill()">

💾 Save Bill

</button>

<button onclick="printBill()">

🖨 Print Bill

</button>

</div>

</div>

</div>
<script src="js/billing.js"></script>

</body>

</html>
