<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retail Nanban Billing POS</title>

<link rel="stylesheet" href="css/billing.css">

</head>

<body>

<header>

    <div class="logo">
        🛒 <b>Retail Nanban POS</b>
    </div>

    <div id="liveTime"></div>

</header>


<div class="container">

    <div class="left">

        <!-- Customer -->

        <div class="card">

            <h2>👤 Customer Details</h2>

            <input
                type="text"
                id="custName"
                placeholder="Customer Name">

            <input
                type="text"
                id="custPhone"
                placeholder="Phone Number">

        </div>


        <!-- Product Preview -->

             <!-- Barcode Scan -->

<div class="card">

  <h2>🔍 Scan Product</h2>

<input
    id="sku"
    type="text"
    placeholder="Scan Barcode"
    autocomplete="off"
    autofocus>

<button id="cameraBtn" onclick="startCameraScanner()">
    📷 Scan with Camera
</button>

<div id="reader"></div>

<!-- Shopping Cart -->

<div class="card">

    <h2>🛒 Shopping Cart</h2>

    <div id="cart" class="cart-list">

        <div class="empty-cart">

            Cart is Empty

        </div>

    </div>

</div>

</div>


<!-- Right Side -->

<div class="right">

<div class="card">

<h2>💰 Bill Summary</h2>

<div class="summary">

<p>
<span>Items</span>
<span id="items">0</span>
</p>

<p>
<span>Subtotal</span>
<span id="sub">₹0</span>
</p>

<p>
<span>Discount</span>
<span>₹0</span>
</p>

<h1 id="grand">₹0</h1>

</div>

<select id="payment">

<option>Cash</option>
<option>UPI</option>
<option>Card</option>

</select>

<button onclick="saveBill()">

💾 Save Bill

</button>

<button onclick="printBill()">

🖨 Print Bill

</button>

</div>

</div>

</div>
  <div id="scannerModal" class="scanner-modal">

    <div class="scanner-header">

        <h2>📷 Scan Barcode</h2>

        <button onclick="closeScanner()">✕</button>

    </div>

    <div id="reader"></div>

</div>  
    <!-- Payment Modal -->
<div id="paymentModal" class="payment-modal">

    <div class="payment-box">

        <div class="payment-header">
            <h2>💳 Payment</h2>
            <button onclick="closePayment()">✕</button>
        </div>

        <h1 id="paymentTotal">₹0</h1>

        <button class="pay-btn cash" onclick="payNow('Cash')">
            💵 Cash
        </button>

        <button class="pay-btn card" onclick="payNow('Card')">
            💳 Card
        </button>

        <button class="pay-btn upi" onclick="payNow('UPI')">
            📱 UPI
        </button>

        <button class="pay-btn wallet" onclick="payNow('Wallet')">
            👛 Wallet
        </button>

        <button class="pay-btn split" onclick="payNow('Split')">
            🔀 Split Payment
        </button>

    </div>

</div>
<script src="https://unpkg.com/html5-qrcode"></script>    
<script src="js/billing.js"></script>

</body>

</html>
